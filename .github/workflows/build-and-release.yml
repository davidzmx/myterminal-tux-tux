name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npm run dist:linux
          - os: windows-2022
            platform: windows
            command: npm run dist:win
          - os: macos-latest
            platform: macos
            command: npm run dist:mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (for node-gyp & distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build tools
        run: python -m pip install --upgrade setuptools

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools build-essential

      - name: Setup MSVC C++ Compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm install
        env:
          GYP_MSVS_VERSION: '2022'

      - name: Build and package application
        run: ${{ matrix.command }}
        env:
          GYP_MSVS_VERSION: '2022'
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Subir cada paquete por separado sin meterlo en un zip (igual que en directory-commander-tux-tux)
      - name: Subir instalador Linux .deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.deb
          archive: false

      - name: Subir portable Linux .AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.AppImage
          archive: false

      - name: Subir instalador Windows .exe
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*Setup*.exe
          archive: false

      - name: Subir portable Windows .exe
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*Portable*.exe
          archive: false

      - name: Subir instalador macOS .dmg
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.dmg
          archive: false

      - name: Subir portable macOS .zip
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

