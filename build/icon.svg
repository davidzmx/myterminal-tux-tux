<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Tux Body Gradient -->
    <linearGradient id="tuxBodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="35%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>

    <!-- White Belly Gradient -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Beak & Feet Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Tile / Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#dropShadow)" />

  <!-- Terminal Window Bar inside Tile -->
  <rect x="48" y="44" width="416" height="34" rx="8" fill="#131b2e" opacity="0.65" />
  <!-- Window Controls / Dots -->
  <circle cx="74" cy="61" r="6" fill="#ef4444" />
  <circle cx="94" cy="61" r="6" fill="#f59e0b" />
  <circle cx="114" cy="61" r="6" fill="#10b981" />
  <!-- Title in Header -->
  <text x="256" y="65" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">MYTERMINAL TUX TUX</text>

  <!-- PENGUIN TUX GROUP -->
  <g transform="translate(0, 10)">
    <!-- Feet -->
    <!-- Left Foot -->
    <ellipse cx="196" cy="425" rx="42" ry="16" fill="url(#orangeGrad)" transform="rotate(-10 196 425)" />
    <!-- Right Foot -->
    <ellipse cx="316" cy="425" rx="42" ry="16" fill="url(#orangeGrad)" transform="rotate(10 316 425)" />

    <!-- Tux Wings / Flippers -->
    <!-- Left Wing -->
    <path d="M 160 230 C 120 250, 95 310, 125 365 C 135 380, 155 365, 165 330 Z" fill="url(#tuxBodyGrad)" stroke="#0f172a" stroke-width="2" />
    <!-- Right Wing -->
    <path d="M 352 230 C 392 250, 417 310, 387 365 C 377 380, 357 365, 347 330 Z" fill="url(#tuxBodyGrad)" stroke="#0f172a" stroke-width="2" />

    <!-- Tux Body / Head (Base Black Shape) -->
    <path d="M 256 105
             C 210 105, 175 145, 175 195
             C 175 225, 160 260, 150 310
             C 140 365, 170 420, 256 420
             C 342 420, 372 365, 362 310
             C 352 260, 337 225, 337 195
             C 337 145, 302 105, 256 105 Z"
          fill="url(#tuxBodyGrad)" />

    <!-- White Belly / Face Area -->
    <path d="M 256 142
             C 228 142, 204 162, 204 195
             C 204 216, 218 232, 234 238
             C 192 255, 180 320, 185 360
             C 190 395, 220 408, 256 408
             C 292 408, 322 395, 327 360
             C 332 320, 320 255, 278 238
             C 294 232, 308 216, 308 195
             C 308 162, 284 142, 256 142 Z"
          fill="url(#bellyGrad)" />

    <!-- Tux Eyes -->
    <!-- Left Eye -->
    <ellipse cx="236" cy="182" rx="10" ry="14" fill="#0f172a" />
    <circle cx="233" cy="177" r="4.5" fill="#ffffff" />
    <circle cx="238" cy="186" r="2" fill="#06b6d4" />

    <!-- Right Eye -->
    <ellipse cx="276" cy="182" rx="10" ry="14" fill="#0f172a" />
    <circle cx="273" cy="177" r="4.5" fill="#ffffff" />
    <circle cx="278" cy="186" r="2" fill="#06b6d4" />

    <!-- Beak -->
    <path d="M 234 200 C 244 196, 268 196, 278 200 C 282 208, 266 226, 256 226 C 246 226, 230 208, 234 200 Z" fill="url(#orangeGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Beak highlight -->
    <ellipse cx="256" cy="204" rx="12" ry="3" fill="#fde68a" opacity="0.6" />

    <!-- CHEST SCREEN / TERMINAL BADGE -->
    <!-- Mini Terminal Screen Box on Belly -->
    <rect x="194" y="272" width="124" height="84" rx="10" ry="10" fill="url(#screenGrad)" stroke="#06b6d4" stroke-width="2.5" filter="url(#neonGlow)" />
    <!-- Mini Screen Top Bar -->
    <rect x="194" y="272" width="124" height="15" rx="10" fill="#1e293b" opacity="0.8" />
    <circle cx="204" cy="279.5" r="2.5" fill="#ef4444" />
    <circle cx="212" cy="279.5" r="2.5" fill="#f59e0b" />
    <circle cx="220" cy="279.5" r="2.5" fill="#10b981" />
    
    <!-- Mini Split Icons in Corner -->
    <rect x="300" y="276" width="3" height="7" rx="0.5" fill="#64748b" />
    <rect x="305" y="276" width="3" height="7" rx="0.5" fill="#64748b" />

    <!-- Command Prompt: >_ -->
    <text x="204" y="318" fill="#10b981" font-family="Consolas, 'Fira Code', monospace" font-size="20" font-weight="bold" filter="url(#neonGlow)">&gt;</text>
    <rect x="222" y="303" width="11" height="17" fill="#06b6d4" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
    <!-- Code prompt text -->
    <text x="238" y="316" fill="#38bdf8" font-family="Consolas, 'Fira Code', monospace" font-size="11" font-weight="600">tux</text>
    <text x="204" y="338" fill="#94a3b8" font-family="Consolas, 'Fira Code', monospace" font-size="9.5">~ $</text>
    <text x="226" y="338" fill="#a7f3d0" font-family="Consolas, 'Fira Code', monospace" font-size="9.5">split -v</text>
  </g>
</svg>

